# Keeps the SHA-pinned actions current. Each bump PR must pass the lint workflow; the
# cooldown keeps a freshly published (possibly compromised) release out for a week.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'chore(actions)'
