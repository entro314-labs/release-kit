# Keeps the SHA-pinned actions current. Each bump PR must pass the lint workflow; the
# cooldown keeps a freshly published (possibly compromised) release out for a week.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'chore(actions)'
  # Keeps the dev tooling (oxfmt, oxlint, semver) current under the same rules: the lint
  # workflow gates each bump, and the cooldown keeps a fresh release out for a week.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'chore(deps)'
