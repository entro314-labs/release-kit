# The gate release-kit documents but did not run on itself.
name: check

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository: the tests push only to throwaway local remotes.
permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix because it is untested, not because it is known to work.
        os: [ubuntu-latest, macos-latest, windows-latest]
    # Known not to work yet: the integration fixtures put POSIX `sh` stubs for gh/npm/cargo
    # on PATH, which Windows cannot execute, so roughly half the suite fails there. The leg
    # still runs so the count stays visible, but it does not turn the check red until the
    # fixtures grow Windows shims.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the integration tests build real repositories with real history
          # The fixture repositories push to local bare remotes; nothing needs the token.
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # v6 no longer guesses: without a version here or a `packageManager` field it
          # fails before install. Named here rather than in package.json, where pnpm 12
          # would also pin its own binaries into the lockfile.
          version: 12.7.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Identify git to the fixtures
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
      - run: pnpm run format:check
      - run: pnpm run lint:ci
      - run: pnpm test

  # Local commit-msg hooks cannot see this: a squash merge takes its subject from the pull
  # request title, and that title is the commit release-kit will parse into the changelog
  # and the version bump. Titles reach the shell through env, never through interpolation.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the range below spans the whole branch
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Lint the pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: node release.mjs lint-commits --subject "$TITLE"
      - name: Lint the commits on the branch
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: node release.mjs lint-commits "$RANGE"
