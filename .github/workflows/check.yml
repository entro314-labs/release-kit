# The gate release-kit documents but did not run on itself.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix because it is untested, not because it is known to work.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the integration tests build real repositories with real history
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Identify git to the fixtures
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
      - run: pnpm run format:check
      - run: pnpm run lint:ci
      - run: pnpm test

  # Local commit-msg hooks cannot see this: a squash merge takes its subject from the pull
  # request title, and that title is the commit release-kit will parse into the changelog
  # and the version bump. Titles reach the shell through env, never through interpolation.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the range below spans the whole branch
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Lint the pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: node release.mjs lint-commits --subject "$TITLE"
      - name: Lint the commits on the branch
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: node release.mjs lint-commits "$RANGE"
